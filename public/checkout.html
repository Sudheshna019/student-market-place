<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Student Marketplace</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        .checkout-summary {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            font-weight: bold;
        }
        .payment-method {
            margin-bottom: 20px;
        }
        .payment-method img {
            width: 50px;
            margin-right: 10px;
        }
        .btn-container {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="index.html">
                <i class="fas fa-graduation-cap"></i> Student MarketPlace
            </a>
            <div id="accountSection" class="d-flex">
                <a href="profile.html" class="btn btn-outline-secondary me-2">
                    <i class="fas fa-user"></i> Profile
                </a>
                <a href="cart.html" class="btn btn-primary position-relative">
                    <i class="fas fa-shopping-cart"></i>
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-5 pt-4">
        <h1 class="text-center mb-4">Checkout</h1>
        
        <!-- Order Summary -->
        <div class="checkout-summary mb-4">
            <h4>Order Summary</h4>
            <div id="orderItems">
                <!-- Order items will be loaded here -->
            </div>
            <div class="mt-3">
                <p class="text-end"><strong>Total: <span id="orderTotal">₹0.00</span></strong></p>
            </div>
        </div>

        <!-- Contact Information -->
        <div class="mb-4">
            <h4>Contact Information</h4>
            <form id="checkoutForm">
                <div class="mb-3">
                    <label for="fullName" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="fullName" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <div class="mb-3">
                    <label for="phone" class="form-label">Phone Number</label>
                    <input type="tel" class="form-control" id="phone" required>
                </div>
                <div class="mb-3">
                    <label for="address" class="form-label">Address</label>
                    <textarea class="form-control" id="address" rows="3" required></textarea>
                </div>
                <button type="submit" class="btn btn-success w-100">Place Order</button>
            </form>
        </div>
    </div>

    <!-- Add Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api-config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        let currentCart = null;

        document.addEventListener('DOMContentLoaded', async () => {
            const user = getCurrentUser();
            if (!user) {
                showAlert('warning', 'Please log in to proceed to checkout');
                setTimeout(() => window.location.href = 'index.html', 1500);
                return;
            }

            // Autofill user details
            if (document.getElementById('fullName')) document.getElementById('fullName').value = user.fullName || '';
            if (document.getElementById('email')) document.getElementById('email').value = user.email || '';

            await loadCheckoutItems();
        });

        async function loadCheckoutItems() {
            try {
                currentCart = await apiFetch('/cart');
                const orderItemsContainer = document.getElementById('orderItems');
                const orderTotalElement = document.getElementById('orderTotal');

                orderItemsContainer.innerHTML = '';
                let total = 0;

                const items = currentCart.items || [];
                if (items.length === 0) {
                    showAlert('warning', 'Your cart is empty');
                    setTimeout(() => window.location.href = 'cart.html', 1500);
                    return;
                }

                items.forEach(cartItem => {
                    const item = cartItem.itemId;
                    if (!item) return;
                    const itemTotal = (item.price || 0) * (cartItem.quantity || 1);
                    total += itemTotal;

                    const itemElement = document.createElement('div');
                    itemElement.className = 'd-flex justify-content-between align-items-center mb-2 pb-2 border-bottom';
                    itemElement.innerHTML = `
                        <div>
                            <strong>${item.name}</strong> x ${cartItem.quantity}
                            <small class="text-muted d-block">${item.type || 'sale'}</small>
                        </div>
                        <span>₹${itemTotal.toFixed(2)}</span>
                    `;
                    orderItemsContainer.appendChild(itemElement);
                });

                orderTotalElement.textContent = `₹${total.toFixed(2)}`;
            } catch (error) {
                console.error('Error loading checkout items:', error);
                showAlert('danger', 'Failed to load items for checkout');
            }
        }

        document.getElementById('checkoutForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            try {
                if (!currentCart || !currentCart.items || currentCart.items.length === 0) {
                    showAlert('warning', 'Your cart is empty');
                    return;
                }

                const shippingAddress = {
                    fullName: document.getElementById('fullName').value.trim(),
                    email: document.getElementById('email').value.trim(),
                    phone: document.getElementById('phone').value.trim(),
                    address: document.getElementById('address').value.trim()
                };

                const orderItems = currentCart.items.map(ci => ({
                    itemId: ci.itemId._id,
                    name: ci.itemId.name,
                    price: ci.itemId.price,
                    category: ci.itemId.category,
                    image: ci.itemId.image,
                    type: ci.itemId.type,
                    sellerId: ci.itemId.sellerId
                }));

                const createdOrder = await apiFetch('/orders', {
                    method: 'POST',
                    body: JSON.stringify({
                        items: orderItems,
                        shippingAddress,
                        paymentMethod: 'Cash on Delivery'
                    })
                });

                showAlert('success', 'Order placed successfully!');
                setTimeout(() => window.location.href = 'Thankyou.html', 1000);
            } catch (error) {
                console.error('Error placing order:', error);
                showAlert('danger', error.message || 'Failed to place order.');
            }
        });
    </script>
</body>
</html>
