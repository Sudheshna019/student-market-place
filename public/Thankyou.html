<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Student Marketplace</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            padding: 20px;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .thank-you-message {
            background-color: #f8f9fa;
            padding: 40px;
            border-radius: 10px;
            margin: 20px auto;
            max-width: 600px;
        }
        .thank-you-message h1 {
            color: #28a745;
        }
        .thank-you-message p {
            font-size: 18px;
            margin: 20px 0;
        }
        .btn-container {
            margin-top: 20px;
        }
        .btn-container .btn {
            margin: 10px;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="index.html">
                <i class="fas fa-graduation-cap"></i> Student MarketPlace
            </a>
            <div id="accountSection" class="d-flex">
                <a href="profile.html" class="btn btn-outline-secondary me-2">
                    <i class="fas fa-user"></i> Profile
                </a>
                <a href="cart.html" class="btn btn-primary position-relative">
                    <i class="fas fa-shopping-cart"></i>
                </a>
            </div>
        </div>
    </nav>

    <div class="thank-you-message">
        <h1>Thank You for Your Purchase!</h1>
        <p>Your order has been successfully placed. We appreciate your business and hope you enjoy your items.</p>
        <p>An email confirmation has been sent to your registered email address.</p>
        
        <!-- Buttons for Further Actions -->
        <div class="btn-container">
            <a href="index.html" class="btn btn-primary">
                <i class="fas fa-home"></i> Continue Shopping
            </a>
            <a href="ViewOrderDetails.html" class="btn btn-success" id="viewOrderBtn">
                <i class="fas fa-receipt"></i> View Order Details
            </a>
        </div>
    </div>

    <!-- Add Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <!-- Add Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Add Firebase Configuration -->
    <script src="js/firebase-config.js"></script>

    <!-- Add our auth.js file -->
    <script src="js/auth.js"></script>

    <script>
        // Check authentication on page load
        auth.onAuthStateChanged((user) => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            // Get the latest order ID from the user's orders collection
            db.collection('users').doc(user.uid).collection('orders')
                .orderBy('createdAt', 'desc')
                .limit(1)
                .get()
                .then(snapshot => {
                    if (!snapshot.empty) {
                        const latestOrder = snapshot.docs[0];
                        const viewOrderBtn = document.getElementById('viewOrderBtn');
                        viewOrderBtn.href = `ViewOrderDetails.html?orderId=${latestOrder.id}`;
                    }
                })
                .catch(error => {
                    console.error('Error getting latest order:', error);
                });
        });
    </script>
</body>
</html>
