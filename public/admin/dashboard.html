<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Student Marketplace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 250px;
            background: #343a40;
            padding-top: 20px;
        }
        .main-content {
            margin-left: 250px;
            padding: 20px;
        }
        .sidebar-link {
            color: #fff;
            text-decoration: none;
            padding: 10px 20px;
            display: block;
        }
        .sidebar-link:hover {
            background: #495057;
            color: #fff;
        }
        .sidebar-link.active {
            background: #0d6efd;
        }
        .stats-card {
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="text-center mb-4">
            <i class="fas fa-user-shield text-white fa-2x mb-2"></i>
            <h5 class="text-white">Admin Panel</h5>
        </div>
        <nav>
            <a href="#dashboard" class="sidebar-link active" data-page="dashboard">
                <i class="fas fa-tachometer-alt me-2"></i> Dashboard
            </a>
            <a href="#users" class="sidebar-link" data-page="users">
                <i class="fas fa-users me-2"></i> Users
            </a>
            <a href="#products" class="sidebar-link" data-page="products">
                <i class="fas fa-shopping-bag me-2"></i> Products
            </a>
            <a href="#orders" class="sidebar-link" data-page="orders">
                <i class="fas fa-shopping-cart me-2"></i> Orders
            </a>
            <a href="#reports" class="sidebar-link" data-page="reports">
                <i class="fas fa-chart-bar me-2"></i> Reports
            </a>
            <a href="#" id="logoutBtn" class="sidebar-link text-danger mt-5">
                <i class="fas fa-sign-out-alt me-2"></i> Logout
            </a>
        </nav>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Dashboard Section -->
        <div id="dashboardPage" class="page active">
            <h2 class="mb-4">Dashboard Overview</h2>
            
            <!-- Stats Cards -->
            <div class="row mb-4">
                <div class="col-md-3">
                    <div class="card stats-card bg-primary text-white">
                        <div class="card-body">
                            <h5 class="card-title">Total Users</h5>
                            <h3 id="totalUsers">0</h3>
                            <p class="mb-0"><small>Active accounts</small></p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card stats-card bg-success text-white">
                        <div class="card-body">
                            <h5 class="card-title">Total Products</h5>
                            <h3 id="totalProducts">0</h3>
                            <p class="mb-0"><small>Listed items</small></p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card stats-card bg-info text-white">
                        <div class="card-body">
                            <h5 class="card-title">Total Orders</h5>
                            <h3 id="totalOrders">0</h3>
                            <p class="mb-0"><small>Completed transactions</small></p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card stats-card bg-warning text-white">
                        <div class="card-body">
                            <h5 class="card-title">Pending Orders</h5>
                            <h3 id="pendingOrders">0</h3>
                            <p class="mb-0"><small>Awaiting processing</small></p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Recent Activity -->
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0">Recent Activity</h5>
                </div>
                <div class="card-body">
                    <div id="recentActivity">
                        <!-- Activity items will be loaded here -->
                        <div class="text-center">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Other pages will be added dynamically -->
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="../js/auth.js"></script>
    <script src="js/admin-dashboard.js"></script>
</body>
</html>
