<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Student Marketplace</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        .cart-item {
            border-bottom: 1px solid #ddd;
            padding: 15px 0;
        }
        .cart-item img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 5px;
        }
        .cart-item .quantity {
            width: 60px;
            text-align: center;
        }
        .cart-summary {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="index.html">
                <i class="fas fa-graduation-cap"></i> Student MarketPlace
            </a>
            <div id="accountSection" class="d-flex">
                <a href="profile.html" class="btn btn-outline-secondary me-2">
                    <i class="fas fa-user"></i> Profile
                </a>
                <a href="cart.html" class="btn btn-primary position-relative">
                    <i class="fas fa-shopping-cart"></i>
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-5 pt-4">
        <h1 class="text-center mb-4">Shopping Cart</h1>
        
        <!-- Cart Items -->
        <div class="cart-items" id="cart-items">
            <!-- Cart items will be dynamically inserted here -->
        </div>

        <!-- Cart Summary -->
        <div class="cart-summary mt-4">
            <h4>Order Summary</h4>
            <p>Subtotal (<span id="item-count">0</span> items): <span class="fw-bold" id="subtotal">₹0.00</span></p>
            <p>Total: <span class="fw-bold" id="total">₹0.00</span></p>
            <button class="btn btn-success w-100" onclick="proceedToCheckout()">Proceed to Checkout</button>
        </div>
    </div>

    <!-- Add Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api-config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = getCurrentUser();
            if (!user) {
                showAlert('warning', 'Please log in to view your cart');
                setTimeout(() => window.location.href = 'index.html', 1500);
                return;
            }
            loadCartItems();
        });

        async function loadCartItems() {
            try {
                const cart = await apiFetch('/cart');
                const cartItemsContainer = document.getElementById('cart-items');
                const itemCountElement = document.getElementById('item-count');
                const subtotalElement = document.getElementById('subtotal');
                const totalElement = document.getElementById('total');

                cartItemsContainer.innerHTML = '';
                let subtotal = 0;

                const items = cart.items || [];
                itemCountElement.textContent = items.length;

                if (items.length === 0) {
                    cartItemsContainer.innerHTML = '<div class="text-center py-5"><i class="fas fa-shopping-cart fa-3x text-muted mb-3"></i><h4>Your cart is empty</h4></div>';
                    subtotalElement.textContent = '₹0.00';
                    totalElement.textContent = '₹0.00';
                    return;
                }

                items.forEach(cartItem => {
                    const item = cartItem.itemId;
                    if (!item) return;
                    subtotal += (item.price || 0) * (cartItem.quantity || 1);

                    const itemElement = document.createElement('div');
                    itemElement.className = 'cart-item row align-items-center mb-3 p-3 bg-light rounded';
                    itemElement.innerHTML = `
                        <div class="col-md-2">
                            <img src="${item.image || 'https://via.placeholder.com/100'}" alt="${item.name}" class="img-fluid rounded" style="max-height: 80px; object-fit: cover;">
                        </div>
                        <div class="col-md-4">
                            <h5>${item.name}</h5>
                            <small class="text-muted">Type: ${item.type || 'sale'}</small>
                        </div>
                        <div class="col-md-2">
                            <p class="fw-bold mb-0">₹${item.price}</p>
                        </div>
                        <div class="col-md-2">
                            <p class="text-muted mb-0">Qty: ${cartItem.quantity}</p>
                        </div>
                        <div class="col-md-2 text-end">
                            <button class="btn btn-outline-danger btn-sm" onclick="removeItem('${item._id}')"><i class="fas fa-trash"></i></button>
                        </div>
                    `;
                    cartItemsContainer.appendChild(itemElement);
                });

                subtotalElement.textContent = `₹${subtotal.toFixed(2)}`;
                totalElement.textContent = `₹${subtotal.toFixed(2)}`;
            } catch (error) {
                console.error('Error loading cart:', error);
                showAlert('danger', 'Failed to load cart items');
            }
        }

        async function removeItem(itemId) {
            try {
                await apiFetch('/cart/remove', {
                    method: 'POST',
                    body: JSON.stringify({ itemId })
                });
                showAlert('success', 'Item removed from cart');
                loadCartItems();
            } catch (error) {
                showAlert('danger', 'Failed to remove item');
            }
        }

        function proceedToCheckout() {
            window.location.href = 'checkout.html';
        }
    </script>
</body>
</html>
