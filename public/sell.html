<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sell Items - Student Marketplace</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
    body { padding: 20px; font-family: Arial, sans-serif; }
    .sell-form { max-width: 600px; margin: 0 auto; background-color: #f8f9fa; padding: 20px; border-radius: 10px; }
    .listed-items { margin-top: 40px; }
    .listed-items .card { margin-bottom: 20px; }
    .card-img-top { max-height: 200px; object-fit: cover; }
</style>
</head>
<body>
<script>
    // Fetch and inject the navigation bar
    fetch('navbar.html')
        .then(response => response.text())
        .then(data => {
        document.body.insertAdjacentHTML('afterbegin', data);
        });
    </script>
<body>
<div class="container">
    <h1 class="text-center mb-4">Sell Your Items</h1>
    <div class="sell-form">
        <h2 class="text-center mb-4">List an Item for Sale</h2>
        <form id="sellItemForm">
            <div class="mb-3">
                <label for="itemName" class="form-label">Item Name</label>
                <input type="text" class="form-control" id="itemName" placeholder="e.g., Introduction to Algorithms" required>
            </div>
            <div class="mb-3">
                <label for="itemCategory" class="form-label">Category</label>
                <select class="form-control" id="itemCategory" required>
                    <option value="Textbooks">Textbooks</option>
                    <option value="Gadgets">Gadgets</option>
                    <option value="Stationery">Stationery</option>
                    <option value="Lab Equipment">Lab Equipment</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="itemCondition" class="form-label">Condition</label>
                <select class="form-control" id="itemCondition" required>
                    <option value="New">New</option>
                    <option value="First-Hand">First-Hand</option>
                    <option value="Second-Hand">Second-Hand</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="itemDescription" class="form-label">Description</label>
                <textarea class="form-control" id="itemDescription" rows="3" placeholder="e.g., Good condition, latest edition" required></textarea>
            </div>
            <div class="mb-3">
                <label for="itemPrice" class="form-label">Price (in ₹)</label>
                <input type="number" class="form-control" id="itemPrice" min="0" step="0.01" required>
            </div>
            <div class="mb-3">
                <label for="itemImage" class="form-label">Item Image</label>
                <input type="file" class="form-control" id="itemImage" accept="image/*" required>
                <img id="imagePreview" src="" class="mt-2 img-fluid d-none" style="max-width: 150px;">
            </div>
            <button type="submit" class="btn btn-primary w-100">List Item for Sale</button>
        </form>
    </div>

    <div class="listed-items">
        <h2 class="text-center mb-4">Your Listed Items</h2>
        <div id="listedItemsContainer"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/items.js"></script>
<script>
    document.getElementById('sellItemForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        const itemData = {
            name: document.getElementById('itemName').value.trim(),
            category: document.getElementById('itemCategory').value.toLowerCase().replace(/\s+/g, '-'),
            condition: document.getElementById('itemCondition').value,
            description: document.getElementById('itemDescription').value.trim(),
            price: document.getElementById('itemPrice').value,
            image: document.getElementById('itemImage').files[0],
            type: 'sale'
        };

        const result = await addItemForSale(itemData);
        if (result) {
            document.getElementById('sellItemForm').reset();
            document.getElementById('imagePreview').classList.add('d-none');
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1500);
        }
    });

    document.getElementById('itemImage').addEventListener('change', function() {
        const file = this.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const imgPreview = document.getElementById('imagePreview');
                imgPreview.src = e.target.result;
                imgPreview.classList.remove('d-none');
            };
            reader.readAsDataURL(file);
        }
    });
</script>
</body>
</html>
