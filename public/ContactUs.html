<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - StudySupplies</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Custom Styles */
    .contact-section {
      padding: 100px 0;
      background: linear-gradient(120deg, #f8fafc 60%, #e3e6ea 100%);
      min-height: 100vh;
    }
    .contact-form {
      background-color: #fff;
      padding: 2.5rem 2rem;
      border-radius: 1rem;
      box-shadow: 0 4px 32px rgba(0,0,0,0.10);
      transition: box-shadow 0.2s;
    }
    .contact-form:focus-within {
      box-shadow: 0 8px 40px rgba(0,123,255,0.10);
    }
    .contact-form label {
      font-weight: 500;
      color: #2d3a4a;
    }
    .contact-form .form-control {
      border-radius: 0.5rem;
      border: 1.5px solid #e3e6ea;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .contact-form .form-control:focus {
      border-color: #007bff;
      box-shadow: 0 0 0 2px rgba(0,123,255,0.10);
    }
    .contact-form textarea.form-control {
      min-height: 120px;
      resize: vertical;
    }
    .contact-form button[type="submit"] {
      background: linear-gradient(90deg, #2563eb 60%, #1e40af 100%);
      border: none;
      border-radius: 0.5rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 8px rgba(37,99,235,0.08);
      transition: background 0.2s, box-shadow 0.2s;
    }
    .contact-form button[type="submit"]:hover, .contact-form button[type="submit"]:focus {
      background: linear-gradient(90deg, #1e40af 60%, #2563eb 100%);
      box-shadow: 0 4px 16px rgba(37,99,235,0.12);
    }
    @media (max-width: 767px) {
      .contact-section {
        padding: 40px 0;
      }
      .contact-form {
        padding: 1.5rem 0.5rem;
      }
    }
    .contact-info {
      background-color: #ffffff;
      padding: 2rem;
      border-radius: 0.5rem;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    .contact-info i {
      font-size: 1.5rem;
      color: #007bff;
      margin-right: 10px;
    }
    .map-container {
      height: 300px;
      border-radius: 0.5rem;
      overflow: hidden;
      margin-top: 2rem;
    }
    .map-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <!-- Include the navbar -->
  <div id="navbar-container"></div>

  <!-- Contact Section -->
  <section class="contact-section">
    <div class="container">
      <div class="row justify-content-center align-items-center">
        <div class="col-lg-7 d-flex flex-column align-items-center">
          <h1 class="mb-4 text-center">Get in Touch</h1>
          <p class="lead mb-4 text-center">We're here to help! Reach out to us for any questions, feedback, or support.</p>
          <!-- Contact Form -->
          <div class="contact-form w-100" style="max-width: 450px; box-shadow: 0 2px 16px rgba(0,0,0,0.07);">
            <form id="contactForm">
              <div class="mb-3">
                <label for="name" class="form-label">Your Name</label>
                <input type="text" class="form-control" id="name" placeholder="Enter your name" required>
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">Your Email</label>
                <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
              </div>
              <div class="mb-3">
                <label for="subject" class="form-label">Subject</label>
                <input type="text" class="form-control" id="subject" placeholder="Enter subject" required>
              </div>
              <div class="mb-3">
                <label for="message" class="form-label">Your Message</label>
                <textarea class="form-control" id="message" rows="5" placeholder="Enter your message" required></textarea>
              </div>
              <button type="submit" class="btn btn-primary w-100">Send Message</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Add Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <!-- Add Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Add Firebase Configuration -->
  <script src="js/firebase-config.js"></script>

  <!-- Add our auth.js file -->
  <script src="js/auth.js"></script>

  <script>
    // Load the navbar
    fetch('navbar.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('navbar-container').innerHTML = data;
        
        // Initialize authentication state
        auth.onAuthStateChanged((user) => {
          const logoutButton = document.getElementById('logoutButton');
          const sellItemButton = document.getElementById('sellItemButton');
          const accountButton = document.querySelector('[data-bs-target="#loginModal"]');

          if (user) {
            logoutButton.style.display = 'block';
            sellItemButton.disabled = false;
            accountButton.innerHTML = '<i class="fas fa-user"></i> Profile';
            accountButton.setAttribute('data-bs-target', '#profileModal');
            updateCartCount();
          } else {
            logoutButton.style.display = 'none';
            sellItemButton.disabled = true;
            accountButton.innerHTML = '<i class="fas fa-user"></i> Account';
            accountButton.setAttribute('data-bs-target', '#loginModal');
            const cartCountElement = document.getElementById('cartCount');
            if (cartCountElement) {
              cartCountElement.style.display = 'none';
            }
          }
        });
      });

    // Form Validation Script
    document.getElementById('contactForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const subject = document.getElementById('subject').value;
      const message = document.getElementById('message').value;

      if (!name || !email || !subject || !message) {
        alert('Please fill out all fields.');
        return;
      }

      // Store contact form submission in Firestore
      if (auth.currentUser) {
        db.collection('contact_submissions').add({
          userId: auth.currentUser.uid,
          name: name,
          email: email,
          subject: subject,
          message: message,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        })
        .then(() => {
          alert('Thank you for contacting us! We will get back to you soon.');
          document.getElementById('contactForm').reset();
        })
        .catch(error => {
          console.error('Error submitting contact form:', error);
          alert('There was an error submitting your message. Please try again.');
        });
      } else {
        // For non-logged in users
        db.collection('contact_submissions').add({
          name: name,
          email: email,
          subject: subject,
          message: message,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        })
        .then(() => {
          alert('Thank you for contacting us! We will get back to you soon.');
          document.getElementById('contactForm').reset();
        })
        .catch(error => {
          console.error('Error submitting contact form:', error);
          alert('There was an error submitting your message. Please try again.');
        });
      }
    });

    // Function to update cart count
    async function updateCartCount() {
      try {
        const currentUser = auth.currentUser;
        const cartCountElement = document.getElementById('cartCount');

        if (!currentUser || !cartCountElement) {
          if (cartCountElement) {
            cartCountElement.style.display = 'none';
          }
          return;
        }

        const cartRef = db.collection('carts').doc(currentUser.uid);
        const cartDoc = await cartRef.get();

        if (cartDoc.exists) {
          const cartData = cartDoc.data();
          const count = Object.keys(cartData.items || {}).length;

          if (count > 0) {
            cartCountElement.textContent = count;
            cartCountElement.style.display = 'block';
            cartCountElement.style.visibility = 'visible';
          } else {
            cartCountElement.style.display = 'none';
          }
        } else {
          cartCountElement.style.display = 'none';
        }
      } catch (error) {
        console.error('Error updating cart count:', error);
      }
    }
  </script>
</body>
</html>
