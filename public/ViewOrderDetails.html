<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Details - Student Marketplace</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        .order-details {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin: 20px auto;
            max-width: 800px;
        }
        .order-details h2 {
            color: #28a745;
        }
        .order-details .badge {
            font-size: 16px;
        }
        .order-details .list-group-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .order-details .list-group-item img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="index.html">
                <i class="fas fa-graduation-cap"></i> Student MarketPlace
            </a>
            <div id="accountSection" class="d-flex">
                <a href="profile.html" class="btn btn-outline-secondary me-2">
                    <i class="fas fa-user"></i> Profile
                </a>
                <a href="cart.html" class="btn btn-primary position-relative">
                    <i class="fas fa-shopping-cart"></i>
                </a>
            </div>
        </div>
    </nav>

    <div class="order-details">
        <h2 class="text-center mb-4">Order Details</h2>

        <!-- Order ID and Status -->
        <div class="mb-4" id="orderHeader">
            <p><strong>Order ID:</strong> <span id="orderId">Loading...</span></p>
            <p><strong>Order Status:</strong> <span id="orderStatus" class="badge">Loading...</span></p>
            <p><strong>Order Date:</strong> <span id="orderDate">Loading...</span></p>
        </div>

        <!-- Ordered Items -->
        <h4>Ordered Items</h4>
        <ul class="list-group mb-4" id="orderItems">
            <!-- Items will be loaded here -->
        </ul>

        <!-- Order Summary -->
        <h4>Order Summary</h4>
        <ul class="list-group mb-4" id="orderSummary">
            <!-- Summary will be loaded here -->
        </ul>

        <!-- Shipping Address -->
        <h4>Shipping Address</h4>
        <div class="mb-4" id="shippingAddress">
            <!-- Address will be loaded here -->
        </div>

        <!-- Back to Home Button -->
        <div class="text-center">
            <a href="index.html" class="btn btn-primary">
                <i class="fas fa-home"></i> Back to Home
            </a>
        </div>
    </div>

    <!-- Add Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api-config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = getCurrentUser();
            if (!user) {
                showAlert('warning', 'Please log in');
                setTimeout(() => window.location.href = 'index.html', 1500);
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const orderId = urlParams.get('id') || urlParams.get('orderId');

            if (!orderId) {
                showAlert('danger', 'No order ID specified');
                return;
            }

            await loadOrderDetails(orderId);
        });

        async function loadOrderDetails(orderId) {
            try {
                const order = await apiFetch(`/orders/${orderId}`);

                document.getElementById('orderId').textContent = order._id;
                document.getElementById('orderStatus').textContent = order.status;
                document.getElementById('orderStatus').className = `badge bg-${order.status === 'confirmed' ? 'success' : 'primary'}`;
                
                const orderDate = new Date(order.createdAt).toLocaleDateString('en-US', {
                    year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
                });
                document.getElementById('orderDate').textContent = orderDate;

                const orderItemsContainer = document.getElementById('orderItems');
                orderItemsContainer.innerHTML = '';

                (order.items || []).forEach(item => {
                    const itemElement = document.createElement('li');
                    itemElement.className = 'list-group-item';
                    itemElement.innerHTML = `
                        <div class="d-flex align-items-center">
                            <img src="${item.image || 'https://via.placeholder.com/80'}" alt="${item.name}" class="me-3 rounded" style="width: 60px; height: 60px; object-fit: cover;">
                            <div>
                                <h6 class="mb-1">${item.name}</h6>
                                <small class="text-muted">Type: ${item.type || 'sale'}</small>
                            </div>
                        </div>
                        <span class="badge bg-primary rounded-pill">₹${item.price}</span>
                    `;
                    orderItemsContainer.appendChild(itemElement);
                });

                const orderSummaryContainer = document.getElementById('orderSummary');
                orderSummaryContainer.innerHTML = `
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        Total Items (${(order.items || []).length})
                        <span class="badge bg-secondary rounded-pill">${(order.items || []).length}</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <strong>Total Amount</strong>
                        <span class="badge bg-success rounded-pill">₹${order.totalAmount}</span>
                    </li>
                `;

                const shippingAddressContainer = document.getElementById('shippingAddress');
                if (order.shippingAddress) {
                    shippingAddressContainer.innerHTML = `
                        <p><strong>Name:</strong> ${order.shippingAddress.fullName || order.buyerName}</p>
                        <p><strong>Email:</strong> ${order.shippingAddress.email || order.buyerEmail}</p>
                        <p><strong>Phone:</strong> ${order.shippingAddress.phone || 'N/A'}</p>
                        <p><strong>Address:</strong> ${order.shippingAddress.address || 'N/A'}</p>
                    `;
                }
            } catch (error) {
                console.error('Error loading order details:', error);
                showAlert('danger', 'Failed to load order details');
            }
        }
    </script>
</body>
</html>
