<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gadgets - Student MarketPlace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .hero-section {
      background: linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.2)), url('./IMAGES2/image.png');
      background-size: cover;
      background-position: center;
      color: rgb(5, 6, 0);
      padding: 100px 0;
    }
    .product-card {
      transition: transform 0.3s;
      height: 100%;
    }
    .product-card:hover {
      transform: translateY(-5px);
    }
  </style>
</head>
<body>
  <!-- Include the navbar -->
  <div id="navbar-container"></div>
  
  <section class="hero-section mt-5 text-center">
    <div class="container">
      <h1 class="display-4 fw-bold">Gadgets</h1>
      <p class="lead">Find the best gadgets for your academic and personal needs.</p>
    </div>
  </section>
  
  <section class="py-5">
    <div class="container">
      <div class="row g-4" id="itemsContainer">
        <!-- Items will be loaded dynamically here -->
      </div>
    </div>
  </section>
  
  <footer class="bg-dark text-white text-center py-3">
    <p>&copy; 2025 Student MarketPlace. All rights reserved.</p>
  </footer>

  <!-- Add Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>

  <!-- Add Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Add API Config -->
  <script src="js/api-config.js"></script>

  <!-- Add our auth.js file -->
  <script src="js/auth.js"></script>

  <!-- Add items.js file -->
  <script src="js/items.js"></script>

  <script>
    // Load the navbar
    fetch('navbar.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('navbar-container').innerHTML = data;
        
        // Initialize authentication state
        auth.onAuthStateChanged((user) => {
          const logoutButton = document.getElementById('logoutButton');
          const sellItemButton = document.getElementById('sellItemButton');
          const accountButton = document.querySelector('[data-bs-target="#loginModal"]');

          if (user) {
            logoutButton.style.display = 'block';
            sellItemButton.disabled = false;
            accountButton.innerHTML = '<i class="fas fa-user"></i> Profile';
            accountButton.setAttribute('data-bs-target', '#profileModal');
            updateCartCount();
          } else {
            logoutButton.style.display = 'none';
            sellItemButton.disabled = true;
            accountButton.innerHTML = '<i class="fas fa-user"></i> Account';
            accountButton.setAttribute('data-bs-target', '#loginModal');
            const cartCountElement = document.getElementById('cartCount');
            if (cartCountElement) {
              cartCountElement.style.display = 'none';
            }
          }
        });

        // Load gadgets when the page loads
        loadItemsByCategory('gadgets');
      });
  </script>
</body>
</html>
