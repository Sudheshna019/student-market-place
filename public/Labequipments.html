<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab Equipment - Student MarketPlace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .hero-section {
      background: linear-gradient(rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.1)), url('./images/images/image.png');
      background-size:contain;
      background-position:left;
      color: rgb(9, 9, 9);
      padding: 100px 0;
    }
    .product-card {
      transition: transform 0.3s;
      height: 100%;
    }
    .product-card:hover {
      transform: translateY(-5px);
    }
  </style>
</head>
<body>
  <!-- Include this script at the top of your HTML files -->
<script>
  // Fetch and inject the navigation bar
  fetch('navbar.html')
    .then(response => response.text())
    .then(data => {
      document.body.insertAdjacentHTML('afterbegin', data);
    });
</script>
  

<section class="hero-section mt-5">
  <div class="container text-center">
    <h1 class="display-4 fw-bold">Lab Equipment</h1>
    <p class="lead mb-4">Find the best lab equipment for your experiments and research.</p>
  </div>
</section>

<section class="py-5">
  <div class="container">
    <h2 class="text-center mb-5">Available Lab Equipment</h2>
    <div class="row g-4" id="itemsContainer">
      <!-- Items will be loaded dynamically here -->
    </div>
  </div>
</section>

<footer class="footer bg-dark text-white py-4">
  <div class="container text-center">
    <p>© 2025 Student MarketPlace. All rights reserved.</p>
  </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Cart Functionality -->
<script>
  // Initialize cart in localStorage if it doesn't exist
  if (!localStorage.getItem('cart')) {
    localStorage.setItem('cart', JSON.stringify([]));
  }

  // Add to Cart Functionality
  document.querySelectorAll('.add-to-cart').forEach(button => {
    button.addEventListener('click', () => {
      const product = {
        name: button.getAttribute('data-name'),
        price: button.getAttribute('data-price'),
      };

      // Get the current cart from localStorage
      const cart = JSON.parse(localStorage.getItem('cart'));

      // Add the product to the cart
      cart.push(product);

      // Save the updated cart back to localStorage
      localStorage.setItem('cart', JSON.stringify(cart));

      // Optional: Notify the user
      alert(`${product.name} has been added to your cart!`);
    });
  });
</script>

<!-- Add Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<!-- Add API Config -->
<script src="js/api-config.js"></script>

<!-- Add our auth.js file -->
<script src="js/auth.js"></script>

<!-- Add items.js file -->
<script src="js/items.js"></script>

<script>
    // Load lab equipment when the page loads
    document.addEventListener('DOMContentLoaded', async function() {
        await loadItemsByCategory('lab-equipment');
    });
</script>
</body>
</html>
